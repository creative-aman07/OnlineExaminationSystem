version: "3.8"

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: examdb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: examdb_root_pass
      MYSQL_DATABASE: examdb
      MYSQL_USER: examuser
      MYSQL_PASSWORD: exampass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pexamdb_root_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application (Tomcat + WAR)
  app:
    build: .
    container_name: examportal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JDBC_URL: jdbc:mysql://db:3306/examdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: examuser
      DB_PASSWORD: exampass
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
