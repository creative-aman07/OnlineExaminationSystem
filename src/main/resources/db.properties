# ============================================================
# Database Configuration
# ============================================================
# MySQL (primary) — update these to match your MySQL setup:
jdbc.url=jdbc:mysql://localhost:3306/examdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
jdbc.username=root
jdbc.password=${DB_PASSWORD}

# If MySQL is unreachable, the app auto-falls back to H2 in-memory.
# For production, set environment variables instead of editing this file:
#   JDBC_URL, DB_USER, DB_PASSWORD
# or Railway-style:
#   MYSQLHOST, MYSQLPORT, MYSQL_DATABASE, MYSQLUSER, MYSQLPASSWORD